# Optional: run on your own Mac with Docker Desktop. This does not log in to QQ for you.
# Upstream documents Linux/amd64 and Linux/arm64 images; Docker selects the host architecture.
services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: plave-qq
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ
